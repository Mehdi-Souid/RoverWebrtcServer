<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover WebRTC - PC Receiver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2a2a2a;
            padding: 20px;
            border-bottom: 2px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
        }

        .header .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        .status {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }

        .video-container {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder {
            text-align: center;
            color: #666;
        }

        .placeholder-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .streaming-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .streaming-indicator.active {
            display: flex;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stats {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }

        .stats.active {
            display: block;
        }

        .stats-row {
            margin-bottom: 5px;
        }

        .stats-label {
            color: #888;
            margin-right: 8px;
        }

        .footer {
            background: #2a2a2a;
            padding: 15px 20px;
            border-top: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>📹 Rover WebRTC Receiver</h1>
                <div class="subtitle">Low-Latency Camera Streaming</div>
            </div>
            <div class="status">
                <div class="status-item">
                    <div class="status-dot" id="signalingStatus"></div>
                    <span id="signalingText">Signaling: Disconnected</span>
                </div>
                <div class="status-item">
                    <div class="status-dot" id="webrtcStatus"></div>
                    <span id="webrtcText">WebRTC: new</span>
                </div>
            </div>
        </div>

        <!-- Video Container -->
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline muted></video>
            
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">📡</div>
                <div>Waiting for stream...</div>
                <div style="margin-top: 10px; font-size: 12px;">Make sure mobile app is streaming</div>
            </div>

            <div class="streaming-indicator" id="streamingIndicator">
                <div class="recording-dot"></div>
                <span>RECEIVING</span>
            </div>

            <div class="stats" id="stats">
                <div class="stats-row">
                    <span class="stats-label">Resolution:</span>
                    <span id="resolution">-</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">FPS:</span>
                    <span id="fps">-</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">Bitrate:</span>
                    <span id="bitrate">-</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="info">
                Signaling Server: ws://localhost:9000
            </div>
            <div class="info" id="latencyInfo">
                Latency: Measuring...
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
